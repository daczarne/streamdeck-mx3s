<!DOCTYPE html>
<html>

  <head lang="en">
    <title>MX Master 3S Set Host</title>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self';
        style-src 'unsafe-inline';
        img-src data:;
        connect-src ws://localhost:*;
        base-uri 'none';
        form-action 'none'
      "
    />
    <script src="vendor/sdpi-components.js"></script>
  </head>

  <body>
    <!-- The host the key sends the mouse to, by the numbers on the mouse, side by side. -->
    <sdpi-item label="Host">
      <sdpi-radio setting="host" default="1" columns="3">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </sdpi-radio>
    </sdpi-item>
  </body>

</html>
