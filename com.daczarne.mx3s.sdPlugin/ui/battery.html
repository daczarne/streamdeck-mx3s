<!DOCTYPE html>
<html>

  <head lang="en">
    <title>MX Master 3S Battery</title>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self';
        style-src 'unsafe-inline';
        img-src data:;
        connect-src ws://localhost:*;
        base-uri 'none';
        form-action 'none'
      "
    />
    <script src="vendor/sdpi-components.js"></script>
    <style>
      /* A row of controls side by side: a narrow color picker or a checkbox, with the controls that go with it. */
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .row sdpi-color {
        flex: 0 0 72px;
      }

      /* Radio buttons in a row sit at its right end, apart from the checkbox at its left. Their columns are shares of
         their width, so they get one, just enough for two options side by side: without it, they shrink to their
         widest option, and stack. */
      .row sdpi-radio {
        flex: 0 0 150px;
        margin-left: auto;
      }
    </style>
  </head>

  <body>
    <!-- The key's background, the palette's charcoal tile until another color is picked, or none at all, which leaves
         the key black behind the image. A checkbox that starts unchecked has no default, since `default="false"`
         would check it. -->
    <sdpi-item label="Background">
      <div class="row">
        <sdpi-color setting="background" default="#2B2E33"></sdpi-color>
        <sdpi-checkbox setting="noBackground" label="None"></sdpi-checkbox>
      </div>
    </sdpi-item>
    <!-- The mouse in the key's top row: shown, or not, which leaves the battery and the bolt where they are, filled or
         outlined, and under them, its color, the palette's white until another is picked. A checkbox's `default` is
         text, which checks it whatever it says, so Show starts checked. -->
    <sdpi-item label="Mouse icon">
      <div class="row">
        <sdpi-checkbox setting="showMouse" default="true" label="Show"></sdpi-checkbox>
        <sdpi-radio setting="mouseStyle" default="filled" columns="2">
          <option value="filled">Filled</option>
          <option value="outlined">Outlined</option>
        </sdpi-radio>
      </div>
    </sdpi-item>
    <!-- Follow battery level isn't built yet: disabled, and with no setting, it saves nothing. -->
    <sdpi-item>
      <div class="row">
        <sdpi-color setting="mouseColor" default="#F2F2F2"></sdpi-color>
        <sdpi-checkbox label="Follow battery level" disabled></sdpi-checkbox>
      </div>
    </sdpi-item>
    <!-- The battery in the key's top row: shown, or not, which leaves the mouse and the bolt where they are. It takes
         the color of its level, so under Show, Follow battery level stands checked, and the color picker, the green of
         a full battery, does nothing: both are disabled, with no setting, until a battery can take a color of its own. -->
    <sdpi-item label="Battery icon">
      <div class="row">
        <sdpi-checkbox setting="showBattery" default="true" label="Show"></sdpi-checkbox>
      </div>
    </sdpi-item>
    <sdpi-item>
      <div class="row">
        <sdpi-color default="#4CBF68" disabled></sdpi-color>
        <sdpi-checkbox label="Follow battery level" default="true" disabled></sdpi-checkbox>
      </div>
    </sdpi-item>
    <!-- The bolt at the right of the key's top row: shown always, only while the mouse charges, or never, which leaves
         the others where they are. Its color while charging, the palette's green, and, for a key that shows it always,
         its color while not, the palette's slate, dim on the charcoal tile. Follow battery level isn't built yet:
         disabled, and with no setting, it saves nothing. -->
    <sdpi-item label="Bolt icon">
      <sdpi-radio setting="showBolt" default="charging" columns="3">
        <option value="always">Always</option>
        <option value="charging">Charging</option>
        <option value="never">Never</option>
      </sdpi-radio>
    </sdpi-item>
    <sdpi-item label="Charging">
      <div class="row">
        <sdpi-color setting="boltColor" default="#4CBF68"></sdpi-color>
        <sdpi-checkbox label="Follow battery level" disabled></sdpi-checkbox>
      </div>
    </sdpi-item>
    <sdpi-item label="Not charging">
      <div class="row">
        <sdpi-color setting="boltIdleColor" default="#484C52"></sdpi-color>
      </div>
    </sdpi-item>
  </body>

</html>
