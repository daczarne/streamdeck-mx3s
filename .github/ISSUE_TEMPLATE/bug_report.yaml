name: Bug report
description: Something the plugin does wrong.
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: >-
        What you did, which key it was (Set Host or Battery), what the key or the mouse did, and what you expected
        instead.
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: In Stream Deck's preferences, under Plugins.
      placeholder: 0.1.1
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How the plugin runs
      options:
        - Installed from a release
        - Linked from the repository
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Stream Deck device
      placeholder: Stream Deck +
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Stream Deck app version
      placeholder: "7.6"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: The system and its version.
      placeholder: macOS 15.5
    validations:
      required: true
  - type: textarea
    id: mouse
    attributes:
      label: Mouse and receivers
      description: >-
        The mouse's model, the host it was on, and how each of its hosts is connected: through a Logi Bolt receiver, or
        over Bluetooth.
      placeholder: |
        MX Master 3S, on host 1
        Host 1: this computer, with a Logi Bolt receiver
        Host 2: another computer, with a Logi Bolt receiver
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >-
        The lines of `mx3s.log` from around the problem. For an installed plugin, it's in
        `~/Library/Application Support/com.elgato.StreamDeck/Plugins/com.daczarne.mx3s.sdPlugin/logs/` on macOS, and
        in `%APPDATA%\Elgato\StreamDeck\Plugins\com.daczarne.mx3s.sdPlugin\logs\` on Windows.
      render: text
